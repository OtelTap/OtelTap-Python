# Builds oteltap_core natively on Windows/Linux/macOS runners, assembles the x64 binaries into a single
# flat src/oteltap/native/ folder, builds one multi-platform ("fat") oteltap wheel+sdist containing every
# native binary, and publishes it to PyPI (or TestPyPI).

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to build/push (e.g. 0.1.0 or 0.1.0b1)'
        required: true
        default: '0.1.0'
      target:
        description: 'Where to publish'
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

env:
  CARGO_TERM_COLOR: always

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib_name: oteltap_core.dll
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_name: liboteltap_core.so
          - os: macos-latest
            target: x86_64-apple-darwin
            lib_name: liboteltap_core.dylib

    runs-on: ${{ matrix.os }}

    steps:
      - name: Clone OtelTap-Rust
        run: git clone https://github.com/OtelTap/OtelTap-Rust.git oteltap-rust

      - name: Install Rust target ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - name: Build oteltap-core (${{ matrix.target }})
        working-directory: oteltap-rust/oteltap-core
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload native binary (${{ matrix.lib_name }})
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.lib_name }}
          path: oteltap-rust/oteltap-core/target/${{ matrix.target }}/release/${{ matrix.lib_name }}
          if-no-files-found: error

  publish:
    needs: build-native
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-artifacts

      - name: Stage native binaries into src/oteltap/native/ (flat, x64-only)
        run: |
          set -euo pipefail
          mkdir -p src/oteltap/native
          for dir in native-artifacts/native-*/; do
            cp "$dir"* src/oteltap/native/
          done
          echo "Staged native assets:"
          find src/oteltap/native -type f

      - name: Set package version
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ inputs.version }}\"/" pyproject.toml
          grep '^version = ' pyproject.toml

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: twine upload --repository-url https://test.pypi.org/legacy/ dist/*

      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
